<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versify - Poetry Memorization</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1 class="app-title">Versify</h1>
            <p class="app-subtitle">Memorize poetry through practice</p>
        </div>
        <div class="header-center">
            <div class="search-container">
                <input type="text"
                       id="search-input"
                       class="search-input"
                       placeholder="Search poems..."
                       autocomplete="off">
                <button id="clear-search" class="clear-search-btn hidden" title="Clear search">×</button>
            </div>
            <div class="sort-container">
                <label for="sort-select">Sort:</label>
                <select id="sort-select" class="sort-select">
                    <option value="alpha-asc">A → Z</option>
                    <option value="alpha-desc">Z → A</option>
                    <option value="author-asc">Author (A → Z)</option>
                    <option value="author-desc">Author (Z → A)</option>
                    <option value="length-asc">Length (Shortest)</option>
                    <option value="length-desc">Length (Longest)</option>
                    <option value="recent">Recently Practiced</option>
                    <option value="random">Random</option>
                </select>
            </div>
            <div class="view-toggle" role="group" aria-label="View">
                <button type="button" class="view-toggle-btn" data-view="grid" title="Grid view" aria-label="Grid view">
                    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
                </button>
                <button type="button" class="view-toggle-btn" data-view="list" title="List view" aria-label="List view">
                    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1" y="2" width="14" height="2.5" rx="1"/><rect x="1" y="6.75" width="14" height="2.5" rx="1"/><rect x="1" y="11.5" width="14" height="2.5" rx="1"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main id="main-content" class="main-content">
        <div id="loading-indicator" class="loading-indicator hidden">
            <div class="loading-spinner"></div>
            <p>Loading poems...</p>
        </div>

        <div id="error-message" class="error-message hidden">
            <p></p>
        </div>

        <div id="poems-container" class="poems-container">
            <div id="poem-count" class="poem-count"></div>
            <div id="poems-grid" class="poems-grid">
                <!-- Poem cards will be inserted here -->
            </div>
        </div>

        <div id="empty-state" class="empty-state hidden">
            <h3>No Poems Found</h3>
            <p>No poems match your search criteria.</p>
        </div>
    </main>

    <script src="PoemParser.js"></script>
    <script src="StorageService.js"></script>
    <script src="poem-list.js"></script>
</body>
</html>
