<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versify</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/practice.css">
</head>

<body>
    <main class="page-content">
        <a href="index.html" class="back-link">← Poems</a>
        <div class="practice-card">
            <div class="practice-card-header">
                <h2 class="poem-heading" id="title"></h2>
                <p class="poem-byline" id="author"></p>
            </div>
            <div class="practice-card-body">
                <div class="controls-section">
                    Prompt:
                    <div class="toggle-container">
                        <button class="toggle-btn active" data-mode="dots">Dots</button>
                        <button class="toggle-btn" data-mode="text">Text</button>
                        <button class="toggle-btn" data-mode="none">None</button>
                    </div>
                    <button id="micButton" class="mic-btn hidden" type="button"
                            title="Recite aloud" aria-label="Recite aloud" aria-pressed="false">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
                    </button>
                    <span class="hint-text">Shift-Space reveals the next letter</span>
                </div>
                <div id="voiceStatus" class="voice-status" aria-live="polite"></div>
                <div id="displayArea" class="display-area" tabindex="0"></div>
                <input id="hiddenInput" class="hidden-input" type="text" aria-hidden="true">
            </div>
        </div>
    </main>
    <script src="PoemParser.js"></script>
    <script src="StorageService.js"></script>
    <script src="VoiceRecitation.js"></script>
    <script src="app.js"></script>
</body>
</html>
